site_name: SIFT
site_description: Local-first hybrid search engine for personal knowledge files
repo_url: https://github.com/svilupp/sift
repo_name: svilupp/sift

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Power Workflows: power-workflows.md
  - CLI Reference: cli-reference.md
  - Folder Indexes:
      - Overview: folder-indexes/overview.md
      - Format reference: folder-indexes/format.md
      - sift index command: folder-indexes/sift-index-command.md
      - Refresh & generation: folder-indexes/refresh-and-generation.md
      - Agent usage: folder-indexes/agent-usage.md
  - Daemon: daemon.md
  - .siftignore: siftignore.md
  - SPEC: SPEC.md

exclude_docs: |
  experiments/
  plan-aigen/
